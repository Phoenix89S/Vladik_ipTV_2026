name: IPTV Aggregator with DEBUG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------
    # 1. CHECKOUT
    # -----------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------
    # 2. PYTHON
    # -----------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install requests m3u8

    # -----------------------------
    # 3. DEBUG: показать структуру репо
    # -----------------------------
    - name: DEBUG — Repository structure
      run: |
        echo "===== REPOSITORY ROOT ====="
        ls -R .

    # -----------------------------
    # 4. RUN PARSER
    # -----------------------------
    - name: Run aggregator with DEBUG
      run: |
        echo "===== START PARSER ====="
        python3 Vladik_agregator_m3u8.py
      continue-on-error: true

    # -----------------------------
    # 5. DEBUG — показать выходные файлы
    # -----------------------------
    - name: DEBUG — Output structure
      run: |
        echo "===== OUTPUT/WORKING ====="
        ls -R output/working || echo "NO WORKING FILES"
        echo "===== OUTPUT/NEIGHBORS ====="
        ls -R output/neighbors || echo "NO NEIGHBORS FILES"

    # -----------------------------
    # 6. UPLOAD ARTIFACTS
    # -----------------------------
    - name: Upload working playlist
      uses: actions/upload-artifact@v4
      with:
        name: working-playlist
        path: output/working

    - name: Upload neighbors playlist
      uses: actions/upload-artifact@v4
      with:
        name: neighbors-playlist
        path: output/neighbors

    # -----------------------------
    # 7. DEBUG — финальный лог
    # -----------------------------
    - name: DEBUG — Final log
      run: |
        echo "===== DEBUG FINISHED ====="
        echo "Worker URL: ${{ secrets.WORKER_URL }}"
        echo "Parser executed."