name: Run VladIk_2ultra

on:
  workflow_dispatch:

  schedule:
    # 1 января, 1 июня и 1 ноября в 03:00 UTC
    - cron: "0 3 1 1,6,11 *"

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp rich requests

      - name: Download VladIk_2ultra.py
        run: |
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o VladIk_2ultra.py \
            "https://raw.githubusercontent.com/Phoenix89S/Vladik_ipTV_2026/main/VladIk_2ultra.py"

      - name: Check installation
        run: |
          python -c "import aiohttp, rich, requests; print('Dependencies OK')"
          python --version

      - name: Run Ultra IPTV
        id: ultra
        shell: bash
        run: |
          set +e

          mkdir -p output

          python VladIk_2ultra.py \
            --discover \
            --workers 40 \
            -o ./output \
            2>&1 | tee run_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "VladIk_2ultra exit code: ${EXIT_CODE}"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          exit "${EXIT_CODE}"

      - name: Save results
        if: always()
        shell: bash
        run: |
          {
            echo "========================================"
            echo "VladIk_2ultra"
            echo "Run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================"
            echo

            if [ -f run_output.log ]; then
              cat run_output.log
            else
              echo "No run output."
            fi

            echo
            echo "========================================"
          } > results.txt

      - name: Show output files
        if: always()
        run: |
          echo "===== GENERATED FILES ====="

          if [ -d output ]; then
            find output -type f -print
          else
            echo "No output directory."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VladIk_2ultra-results
          path: |
            run_output.log
            results.txt
            output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add results.txt
          git add output/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update VladIk_2ultra results"
            git push
          fi