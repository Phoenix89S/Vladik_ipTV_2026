name: Run VladIk_2ultra

on:
  workflow_dispatch:

  schedule:
    # 1 января, 1 июня и 1 ноября в 03:00 UTC
    - cron: "0 3 1 1,6,11 *"

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Download VladIk_2ultra.py
        run: |
          curl -fL \
            -o VladIk_2ultra.py \
            "https://raw.githubusercontent.com/Phoenix89S/Vladik_ipTV_2026/main/VladIk_2ultra.py"

      - name: Run VladIk_2ultra.py
        run: |
          set +e
          python VladIk_2ultra.py 2>&1 | tee run_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "VladIk_2ultra exit code: ${EXIT_CODE}"
          exit "${EXIT_CODE}"

      - name: Save output
        if: always()
        run: |
          echo "========================================" >> results.txt
          echo "VladIk_2ultra run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> results.txt
          echo "========================================" >> results.txt

          if [ -f run_output.log ]; then
            cat run_output.log >> results.txt
          else
            echo "No output produced." >> results.txt
          fi

          echo >> results.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VladIk_2ultra-log
          path: run_output.log
          if-no-files-found: ignore

      - name: Commit results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "Update results from VladIk_2ultra run"
            git push
          else
            echo "No changes to commit"
          fi