name: VK IPTV M3U Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: vk-iptv-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      # ============================================================
      # 4. DOWNLOAD CURRENT COLLECTOR
      # ============================================================

      - name: Download collector
        run: |
          set -e

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://raw.githubusercontent.com/Phoenix89S/Vladik_ipTV_2026/main/VK_IPTV_M3U_COLLECTOR.py" \
            -o VK_IPTV_M3U_COLLECTOR.py

          test -s VK_IPTV_M3U_COLLECTOR.py

          echo "=============================================="
          echo "COLLECTOR"
          echo "=============================================="

          wc -l VK_IPTV_M3U_COLLECTOR.py
          ls -lh VK_IPTV_M3U_COLLECTOR.py

      # ============================================================
      # 5. RUN COLLECTOR
      # ============================================================

      - name: Run VK IPTV collector
        run: |
          set -e

          python VK_IPTV_M3U_COLLECTOR.py \
            --url "https://m.vk.ru/club228871429" \
            --output "vk_iptv_output" \
            --max-playlist-depth 2 \
            --verbose

      # ============================================================
      # 6. SHOW RESULT
      # ============================================================

      - name: Show collector result
        if: always()
        run: |
          echo "=============================================="
          echo "COLLECTOR OUTPUT"
          echo "=============================================="

          if [ -d "vk_iptv_output" ]; then
            find vk_iptv_output \
              -type f \
              -printf '%p %k KB\n' \
              | sort
          else
            echo "ERROR: vk_iptv_output does not exist"
            exit 1
          fi

      # ============================================================
      # 7. UPLOAD ARTIFACT
      #
      # Каждый запуск получает СВОЙ artifact.
      # Старые artifacts не удаляются этим workflow.
      # ============================================================

      - name: Upload collector artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-iptv-result-${{ github.run_number }}
          path: |
            vk_iptv_output/
            VK_IPTV_M3U_COLLECTOR.py
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      # ============================================================
      # 8. COPY RESULT INTO REPOSITORY
      #
      # Ничего старого в репозитории НЕ удаляем.
      # ============================================================

      - name: Copy results to repository
        run: |
          set -e

          mkdir -p data/vk_iptv

          cp -f vk_iptv_output/combined.m3u \
            data/vk_iptv/combined.m3u

          cp -f vk_iptv_output/records.jsonl \
            data/vk_iptv/records.jsonl

          cp -f vk_iptv_output/posts_urls.txt \
            data/vk_iptv/posts_urls.txt

          cp -f vk_iptv_output/playlists.txt \
            data/vk_iptv/playlists.txt

          cp -f vk_iptv_output/stats.json \
            data/vk_iptv/stats.json

          if [ -f vk_iptv_output/errors.log ]; then
            cp -f vk_iptv_output/errors.log \
              data/vk_iptv/errors.log
          fi

          echo "=============================================="
          echo "REPOSITORY FILES"
          echo "=============================================="

          find data/vk_iptv \
            -maxdepth 1 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      # ============================================================
      # 9. COMMIT
      # ============================================================

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/vk_iptv/

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update VK IPTV collector results"

      # ============================================================
      # 10. PUSH
      # ============================================================

      - name: Push results
        run: |
          git push origin HEAD:main