name: VK IPTV M3U Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: vk-iptv-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 4. DOWNLOAD EXACT SCRIPT
      # ============================================================
      - name: Download VK_IPTV_M3U_COLLECTOR.py
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/Phoenix89S/Vladik_ipTV_2026/main/VK_IPTV_M3U_COLLECTOR.py" \
            -o VK_IPTV_M3U_COLLECTOR.py

      # ============================================================
      # 5. RUN SCRIPT
      # ============================================================
      - name: Run VK IPTV M3U Collector
        run: |
          python VK_IPTV_M3U_COLLECTOR.py

      # ============================================================
      # 6. SHOW RESULTS
      # ============================================================
      - name: Show results
        if: always()
        run: |
          echo "========================================"
          echo "VK IPTV OUTPUT"
          echo "========================================"

          if [ -d "vk_iptv_output" ]; then
            find vk_iptv_output -maxdepth 1 -type f -print
          else
            echo "vk_iptv_output directory not found"
          fi

      # ============================================================
      # 7. COMMIT & PUSH RESULTS
      # ============================================================
      - name: Commit results
        run: |
          git config user.name "VK-IPTV-Bot"
          git config user.email "actions@github.com"

          git add vk_iptv_output || true